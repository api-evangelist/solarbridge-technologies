name: SolarBridge Technologies
description: >-
  SolarBridge Technologies was a solar power-electronics company that developed
  AC photovoltaic (ACPV) technology for residential and commercial solar,
  including its TrueAC modules, the Pantheon and Pantheon II microinverters, and
  the SolarBridge Management System for monitoring installed systems. The company
  was acquired by SunPower in 2014 and no longer operates as an independent
  business; its former marketing site is preserved at solarbridgetech.com. It was
  surfaced as a portfolio company of Battery Ventures and added to the API
  Evangelist network. SolarBridge was a hardware and embedded-electronics
  company and does not publish a public developer program, API, SDK, or
  documentation surface.
